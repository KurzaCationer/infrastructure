apiVersion: k8s.bitwarden.com/v1
kind: BitwardenSecret
metadata:
  name: tailscale-operator-oauth
  namespace: {{ .Release.Namespace }}
spec:
  organizationId: {{ required "organizationId is required" .Values.organizationId | quote }}
  secretName: operator-oauth
  onlyMappedSecrets: true
  map:
    - bwSecretId: {{ required "clientId secret UUID is required" .Values.clientId | quote }}
      secretKeyName: client_id
    - bwSecretId: {{ required "clientSecret secret UUID is required" .Values.clientSecret | quote }}
      secretKeyName: client_secret
  authToken:
    secretName: bitwarden-auth
    secretKey: token
