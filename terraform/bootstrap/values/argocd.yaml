# Terraform owns this Helm release and the operator. Future GitOps applications
# should not adopt these same resources without an explicit ownership migration.
fullnameOverride: argocd

# One replica per component for the single-node cluster.
redis-ha:
  enabled: false
dex:
  enabled: false
notifications:
  enabled: false

configs:
  params:
    # Tailscale terminates HTTPS and forwards HTTP to the ClusterIP service.
    server.insecure: true
  cm:
    admin.enabled: true
    users.anonymous.enabled: false
    # Issuers in the next sync wave must wait for the Cloudflare token.
    resource.customizations.health.k8s.bitwarden.com_BitwardenSecret: |
      if obj.status ~= nil and obj.status.conditions ~= nil then
        for _, condition in ipairs(obj.status.conditions) do
          if condition.type == "SuccessfulSync" and condition.status == "True" then
            return {status = "Healthy", message = "Secrets synchronized"}
          end
        end
      end
      return {status = "Progressing", message = "Waiting for Bitwarden secret synchronization"}
  rbac:
    policy.default: ""

server:
  replicas: 1
  service:
    type: ClusterIP
  ingress:
    enabled: false

extraObjects:
  # Regular release resources survive until the pre-delete Job finishes.
  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: argocd-tailscale-cleanup
      namespace: argocd
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    metadata:
      name: argocd-tailscale-cleanup
    rules:
      - apiGroups: [networking.k8s.io]
        resources: [ingresses]
        resourceNames: [argocd]
        verbs: [get, list, watch, delete]
      - apiGroups: [tailscale.com]
        resources: [proxygroups, proxyclasses]
        resourceNames: [argocd-ingress]
        verbs: [get, list, watch, delete]
      - apiGroups: [argoproj.io]
        resources: [applications]
        resourceNames: [infrastructure]
        verbs: [get, list, watch, delete]
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata:
      name: argocd-tailscale-cleanup
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: argocd-tailscale-cleanup
    subjects:
      - kind: ServiceAccount
        name: argocd-tailscale-cleanup
        namespace: argocd
  - apiVersion: batch/v1
    kind: Job
    metadata:
      name: argocd-tailscale-cleanup
      namespace: argocd
      annotations:
        helm.sh/hook: pre-delete
        helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 780
      template:
        spec:
          serviceAccountName: argocd-tailscale-cleanup
          restartPolicy: Never
          # Wait for controller cleanup before Terraform removes the operator.
          initContainers:
            - name: delete-root-application
              image: registry.k8s.io/kubectl:v1.36.3
              command: [kubectl]
              args: [delete, application.argoproj.io, infrastructure, --namespace=argocd, --ignore-not-found=true, --wait=true, --timeout=300s, --request-timeout=30s]
            - name: delete-ingress
              image: registry.k8s.io/kubectl:v1.36.3
              command: [kubectl]
              args: [delete, ingress, argocd, --namespace=argocd, --ignore-not-found=true, --wait=true, --timeout=120s, --request-timeout=30s]
            - name: delete-proxygroup
              image: registry.k8s.io/kubectl:v1.36.3
              command: [kubectl]
              args: [delete, proxygroup.tailscale.com, argocd-ingress, --ignore-not-found=true, --wait=true, --timeout=120s, --request-timeout=30s]
          containers:
            - name: delete-proxyclass
              image: registry.k8s.io/kubectl:v1.36.3
              command: [kubectl]
              args: [delete, proxyclass.tailscale.com, argocd-ingress, --ignore-not-found=true, --wait=true, --timeout=120s, --request-timeout=30s]
  - apiVersion: tailscale.com/v1alpha1
    kind: ProxyClass
    metadata:
      name: argocd-ingress
    spec:
      statefulSet:
        pod:
          tailscaleContainer:
            # UDP segmentation offload stalls bulk traffic on this Cilium path.
            # https://github.com/tailscale/tailscale/issues/20858
            env:
              - name: TS_DEBUG_DISABLE_UDP_GSO
                value: "true"
  - apiVersion: tailscale.com/v1alpha1
    kind: ProxyGroup
    metadata:
      name: argocd-ingress
    spec:
      type: ingress
      proxyClass: argocd-ingress
      # A ProxyGroup creates a Tailscale Service even with a single replica.
      replicas: 1
      tags:
        - tag:kurza-k8s-proxy
  - apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: argocd
      namespace: argocd
      annotations:
        tailscale.com/proxy-group: argocd-ingress
        tailscale.com/tags: tag:kurza-argocd
        tailscale.com/funnel: "false"
    spec:
      ingressClassName: tailscale
      tls:
        - hosts:
            - argocd
      rules:
        - http:
            paths:
              - path: /
                pathType: Prefix
                backend:
                  service:
                    name: argocd-server
                    port:
                      number: 80
