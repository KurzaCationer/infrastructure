apiVersion: k8s.bitwarden.com/v1
kind: BitwardenSecret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
spec:
  organizationId: set-by-bootstrap
  secretName: cloudflare-api-token
  onlyMappedSecrets: true
  map:
  - bwSecretId: f0a7865e-a717-42bc-8de6-b4e8013df09c
    secretKeyName: api-token
  - bwSecretId: 818f61ea-7569-4362-ac93-b4fb0170c0df
    secretKeyName: api-token-melanie
  authToken:
    secretName: bitwarden-auth
    secretKey: token
