apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: https-test
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: https-test
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - ServerSideApply=true
    - SkipDryRunOnMissingResource=true
  source:
    repoURL: https://github.com/KurzaCationer/infrastructure.git
    targetRevision: main
    path: argocd/workloads/https-test
