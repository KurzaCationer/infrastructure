name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type destroy to remove all Terraform-managed infrastructure
        required: true
        type: string

permissions:
  contents: read

# Share the deployment lock across the entire teardown; never cancel a mutation.
concurrency:
  group: terraform-deploy
  cancel-in-progress: false

jobs:
  confirm:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Confirm destruction
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [[ "$CONFIRMATION" != 'destroy' ]]; then
            echo 'Type destroy in the confirmation input to run this workflow.' >&2
            exit 1
          fi
      - name: Block applies and begin or resume destruction
        env:
          GH_TOKEN: ${{ secrets.INFRASTRUCTURE_VARIABLE_TOKEN }}
        run: python3 .github/scripts/infrastructure_gate.py begin-destroy

  identity:
    needs: confirm
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/terraform-layer.yml
    with:
      layer: identity
      operation: destroy
    secrets:
      INFRASTRUCTURE_VARIABLE_TOKEN: ${{ secrets.INFRASTRUCTURE_VARIABLE_TOKEN }}
      BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}

  bootstrap:
    needs: identity
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/terraform-layer.yml
    with:
      layer: bootstrap
      operation: destroy
    secrets:
      INFRASTRUCTURE_VARIABLE_TOKEN: ${{ secrets.INFRASTRUCTURE_VARIABLE_TOKEN }}
      BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
      BWS_OPERATOR_ACCESS_TOKEN: ${{ secrets.BWS_OPERATOR_ACCESS_TOKEN }}

  cluster:
    needs: bootstrap
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/terraform-layer.yml
    with:
      layer: cluster
      operation: destroy
    secrets:
      INFRASTRUCTURE_VARIABLE_TOKEN: ${{ secrets.INFRASTRUCTURE_VARIABLE_TOKEN }}
      BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}

  disable:
    needs: cluster
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Disable Terraform after all layers have been destroyed
        env:
          GH_TOKEN: ${{ secrets.INFRASTRUCTURE_VARIABLE_TOKEN }}
        run: python3 .github/scripts/infrastructure_gate.py finish-destroy
