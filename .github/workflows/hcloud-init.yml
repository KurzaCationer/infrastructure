name: Hetzner Cloud Initialization

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: Snapshot architecture to build
        type: choice
        default: both
        options:
          - both
          - x86
          - arm

permissions:
  contents: read

concurrency:
  group: hcloud-init
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: hashicorp/setup-packer@v3.4.0
        with:
          version: '1.16.0'
      - name: Check configuration
        id: config
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
          BW_SECRET_IDS: ${{ vars.BW_SECRET_IDS }}
        run: |
          : "${BWS_ACCESS_TOKEN:?Set the BWS_ACCESS_TOKEN repository secret.}"
          : "${BW_SECRET_IDS:?Set the BW_SECRET_IDS repository variable.}"
          secret_id=$(jq -er '.hcloud_token | select(type == "string") | select(test("^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"))' <<< "$BW_SECRET_IDS")
          printf 'hcloud_token_secret_id=%s\n' "$secret_id" >> "$GITHUB_OUTPUT"
      - name: Retrieve Hetzner token from Bitwarden
        uses: bitwarden/sm-action@v3.0.1
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          api_url: ${{ vars.BW_API_URL || 'https://api.bitwarden.com' }}
          identity_url: ${{ vars.BW_IDENTITY_API_URL || 'https://identity.bitwarden.com' }}
          secrets: |
            ${{ steps.config.outputs.hcloud_token_secret_id }} > HCLOUD_TOKEN
      - name: Build snapshots
        env:
          ARCHITECTURE: ${{ inputs.architecture }}
        run: |
          case "$ARCHITECTURE" in
            both) bash terraform/cluster/hcloud-init/build.sh ;;
            x86) bash terraform/cluster/hcloud-init/build.sh -only=hcloud.leapmicro-x86-snapshot ;;
            arm) bash terraform/cluster/hcloud-init/build.sh -only=hcloud.leapmicro-arm-snapshot ;;
            *) echo 'Unsupported architecture.' >&2; exit 1 ;;
          esac
