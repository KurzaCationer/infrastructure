name: Terraform Apply

on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform*.yml'
      - '.github/scripts/**'
  workflow_run:
    workflows: [Hetzner Cloud Initialization]
    types: [completed]
  pull_request:
    paths:
      - 'terraform/**'
      - 'argocd/**'
      - '.github/workflows/terraform*.yml'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: false

jobs:
  gate:
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == github.event.repository.default_branch &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Read through the API under the deployment lock; vars can be stale in queued runs.
      - name: Read current initialization state
        id: gate
        env:
          GH_TOKEN: ${{ secrets.INFRASTRUCTURE_VARIABLE_TOKEN }}
        run: python3 .github/scripts/infrastructure_gate.py check-apply

  validate:
    needs: gate
    if: >-
      always() && !cancelled() &&
      (github.event_name == 'pull_request' || needs.gate.outputs.enabled == 'true')
    name: Validate ${{ matrix.layer }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        layer: [cluster, bootstrap, identity]
    defaults:
      run:
        working-directory: terraform/${{ matrix.layer }}
    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.16.6'
          terraform_wrapper: false
      - run: terraform fmt -check
      - run: terraform init -backend=false -input=false
      - run: terraform validate -no-color
      - name: Verify rendered Argo CD has only private exposure
        if: matrix.layer == 'bootstrap'
        run: |
          python3 -m pip install PyYAML==6.0.3
          python3 "$GITHUB_WORKSPACE/.github/scripts/check_argocd.py"
          python3 "$GITHUB_WORKSPACE/.github/scripts/check_public_ingress.py"
          terraform test -no-color
      - name: Test infrastructure lifecycle gate without network access
        if: matrix.layer == 'cluster'
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/test_infrastructure_gate.py"
      - name: Test enrollment-key lifecycle without network access
        if: matrix.layer == 'cluster'
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/test_tailscale_enrollment.py"
      - name: Test identity provisioning without credentials
        if: matrix.layer == 'identity'
        run: terraform test -no-color

  cluster:
    needs: [gate, validate]
    if: needs.gate.outputs.enabled == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/terraform-layer.yml
    with:
      layer: cluster
    secrets:
      INFRASTRUCTURE_VARIABLE_TOKEN: ${{ secrets.INFRASTRUCTURE_VARIABLE_TOKEN }}
      BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}

  bootstrap:
    needs: cluster
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/terraform-layer.yml
    with:
      layer: bootstrap
    secrets:
      INFRASTRUCTURE_VARIABLE_TOKEN: ${{ secrets.INFRASTRUCTURE_VARIABLE_TOKEN }}
      BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
      BWS_OPERATOR_ACCESS_TOKEN: ${{ secrets.BWS_OPERATOR_ACCESS_TOKEN }}

  identity:
    needs: bootstrap
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/terraform-layer.yml
    with:
      layer: identity
    secrets:
      INFRASTRUCTURE_VARIABLE_TOKEN: ${{ secrets.INFRASTRUCTURE_VARIABLE_TOKEN }}
      BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
